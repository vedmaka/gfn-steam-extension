# Build multi-arch site image and push to GitHub Container Registry.
#
# Triggers: push to master, pull requests targeting master.
# Platforms: linux/amd64, linux/arm64
#
# Optional repo variable (Settings → Variables):
#   VITE_SITE_ORIGIN=https://your-domain.com
# baked in at image build time for SEO absolute URLs.

name: Site Docker

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - ".github/workflows/site-docker.yml"
  pull_request:
    branches: [master]
    paths:
      - "site/**"
      - ".github/workflows/site-docker.yml"

concurrency:
  group: site-docker-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Package: ghcr.io/<owner>/<repo>/site (lowercased by metadata-action)
  IMAGE_NAME: ${{ github.repository }}/site

jobs:
  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=master,enable=${{ github.ref == 'refs/heads/master' }}
          labels: |
            org.opencontainers.image.title=GFN Checker site
            org.opencontainers.image.description=Landing page for GeForce Now Checker for Steam
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./site
          file: ./site/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_SITE_ORIGIN=${{ vars.VITE_SITE_ORIGIN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Provenance/SBOM for multi-arch manifests can be noisy on free runners; keep off by default
          provenance: false
          sbom: false
