server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security / privacy-minded defaults for a static marketing site
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip common text assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Fingerprinted Vite assets: long cache
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Screenshots and other static public files
    location /screenshots/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|webp|svg)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # SPA routes (e.g. /privacy) fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
