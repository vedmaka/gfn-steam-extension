# GeForce Now Checker landing site
#
# Build and run:
#   docker compose up --build
#
# With SEO origin baked into the client bundle:
#   VITE_SITE_ORIGIN=https://your-domain.com docker compose up --build
#
# Site: http://localhost:8080

services:
  site:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build-time only (Vite inlines this). Override via env when composing.
        VITE_SITE_ORIGIN: ${VITE_SITE_ORIGIN:-}
    #image: gfn-checker-site:local
    ports:
      - "${PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
